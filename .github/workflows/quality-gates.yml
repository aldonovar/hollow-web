name: Web Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hollow-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-contract:
    name: Contract and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify ecosystem contract
        run: npm run test:contract

      - name: Build production application
        run: npm run build

      - name: Verify Cloudflare Pages artifacts
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/_redirects
